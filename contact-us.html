<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Contact Us</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  </head>
</head>
<body class="form">
  <header>

    <div class="form-nav">
    <nav class="nav-form">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="embedded-content.html">About Us</a></li>
        <!-- <li><a href="contact-us.html">Contact Us</a></li> -->
      </ul>
    </nav>
</div>


    <h1 class="form">Contact Us</h1>
  </header>

  <main>

    <section>Contact Information</section>

    <form id="contact-form" action="#" method="post">

      <div class="form-group">

      <label for="name">Full Name: </label>
      <input type="text" id="name" name="name" required minlength="3">

      </div >

      <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" name="email" id="email" required minlength="5">
    </div>


<div class="form-group">
  <label for="phone-number">Phone Number:</label>
  <input type="tel" id="phone-number" name="phone-number" required pattern="[0-9] {10}">
</div>


<div class="form-group">

<label for="subject">Subject:</label>
<select id="subject" name="subject" required>
  <option value="">Select a subject</option>
  <option value="general-inquiry">General Inquiry</option>
  <option value="support">Support</option>
  <option value="feedback">Feedback</option>
</select>
</div>


 <div class="form-group">

      <label for="message"> Message:</label>
         <textarea id="message" name="message" required minlength="10" rows="5"></textarea>
    
    </div>

    <div class="form-group">
      <label for="newsletter">
        <input type="checkbox" id="newsletter" name="newsletter">
        Subscribe to Newsletter:</label>

    </div>



      <button type="submit">Send Message</button>
    </form>
   

  </main>

   <footer>
      <p>&copy; 2023 Your Company. All rights reserved.</p>
    </footer>

</body>
</html>
